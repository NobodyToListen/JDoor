name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build app image on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Build app image on Unix
        if: runner.os != 'Windows'
        run: ./scripts/package.sh

      - name: Archive Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\dist | Out-Null
          Compress-Archive -LiteralPath 'target\package\JDoor Assist' -DestinationPath 'target\dist\jdoor-assist-windows-x64.zip'
          (Get-FileHash 'target\dist\jdoor-assist-windows-x64.zip' -Algorithm SHA256).Hash.ToLower() + '  jdoor-assist-windows-x64.zip' |
            Set-Content -Encoding ascii 'target\dist\jdoor-assist-windows-x64.zip.sha256'

      - name: Archive macOS app image
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/dist
          ditto -c -k --sequesterRsrc --keepParent "target/package/JDoor Assist.app" "target/dist/jdoor-assist-macos-arm64.zip"
          cd target/dist
          shasum -a 256 "jdoor-assist-macos-arm64.zip" > "jdoor-assist-macos-arm64.zip.sha256"

      - name: Archive Linux app image
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/dist
          tar -C target/package -czf target/dist/jdoor-assist-linux-x64.tar.gz "JDoor Assist"
          cd target/dist
          sha256sum jdoor-assist-linux-x64.tar.gz > jdoor-assist-linux-x64.tar.gz.sha256

      - name: Add SBOM to Linux release assets
        if: runner.os == 'Linux'
        run: cp target/jdoor-assist-sbom.json target/dist/jdoor-assist-sbom.json

      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/dist/*

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7
          path: target/dist/*

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify downloaded release assets
        working-directory: release-assets
        run: |
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done

      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "JDoor Assist ${GITHUB_REF_NAME}"
