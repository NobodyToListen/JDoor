name: Feature request
description: Propose a consent-preserving improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What authorized support task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Consent and security impact
      description: Explain new data, permissions, protocol messages, or trust assumptions.
    validations:
      required: true
